<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="">
    <meta name="description" content="">
    <title>To-Do-list</title>
    <!-- 웹글꼴 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
    <!-- 파비콘 -->
    <link rel="shortcut icon" href="" type="image/x-icon">
    <!-- 디자인 -->
    <link rel="stylesheet" href="./styles/reset.css"><!-- ★reset 먼저 작성 -->
    <!-- <link rel="stylesheet" href="./styles/index.css"> -->
    <link rel="stylesheet" href="./styles/study.css">
</head>
<body>
    <div id="wrap">
        <header>
            <!-- 1행 -->
            <div class="top">
                <h1><a href="">To Do</a></h1>
                <div class="search_menu_btn">
                    <a href="#" class="search_btn"><img src="./images/search.svg" alt="검색하기"></a>
                    <a href="#" class="menu_btn"><img src="./images/menu.svg" alt="전체메뉴"></a>
                </div> <!-- e : .search_menu_btn -->
            </div> <!-- e : .top -->
            <!-- 2행  -->
            <nav>
                <a href="#" class="all active">All<span class="num">(3)</span></a>
                <a href="#" class="today">Today<span class="num">(0)</span></a>
            </nav>
        </header>
        <main>
            <!-- 1. 날짜~할일 목록 리스트  -->
            <ul class="to-do-list">
                <li>
                    <a href="#" class="date">05.12</a>
                    <a href="#" class="list">매일 책 15분 읽기 목표</a>
                </li>
                <li>
                    <a href="#" class="date">05.12</a>
                    <a href="#" class="list">매일 책 15분 읽기 목표</a>
                </li>
                <li>
                    <a href="#" class="date">05.12</a>
                    <a href="#" class="list">매일 책 15분 읽기 목표</a>
                </li>
                <li>
                    <a href="#" class="date">05.12</a>
                    <a href="#" class="list">매일 책 15분 읽기 목표</a>
                </li>
            </ul>
            <!-- 2. 글쓰기 버튼 -->
            <a href="#" class="write_popup_btn"><img src="./images/write.svg" alt="글쓰기 버튼"></a>
            <!-- 3. 글쓰기 버튼 클릭 시 실행화면 -->
            <div class="write_popup">
                <p class="info">add a new task</p>
                <a href="#" class="write_btn"><img src="./images/check_circle.svg" alt="글쓰기"></a>
            </div>
        </main>
    </div><!-- e : #wrap  -->
</body>
</html>
